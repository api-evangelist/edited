aid: edited
name: EDITED
description: >-
  EDITED is an AI-powered retail intelligence platform that helps retailers,
  buyers, merchandisers, planners, designers, and eCommerce teams make
  data-driven decisions across assortment, pricing, and promotions. Its Market
  API (the EDITED Data product) exposes a large normalized retail market data
  set — SKUs, brands, categories, pricing, and assortment signals across
  thousands of retailers and many countries — so organizations can benchmark
  against competitors in real time, spot emerging trends early, and integrate
  competitive intelligence into their own systems. The company is a Seedcamp
  portfolio company; access to the Market API is sales-gated (demo / contact
  sales) with no public developer portal or OpenAPI at this time.
